name: Deploy Belema

on:
  push:
    branches: ["main"]
  workflow_dispatch:


permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend (Belemaweb)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout backend (BelemaApi)
        uses: actions/checkout@v4
        with:
          repository: solaoluwa123/BelemaApi
          ref: main
          path: belema_backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build frontend dist
        env:
          VITE_BASE_PATH: /belema/
          VITE_API_BASE_URL: /sparkpayapi
          VITE_ENABLE_MOCK_AUTH: "false"
          VITE_BRAND: belema
          VITE_API_AUTHORIZATION_HEADER: "Bearer 958455015C7DB0F3CEDD56F8F3E50E94568905B636A4954A478030E2603E8A7758F8843B7A6EDC837CA5C6B57B262FDF3B44C7FF706DC3EB991EECFC7840FEC7"
        run: |
          npm ci
          npx vite build

      - name: Copy dist into Spring wrapper
        run: |
          STATIC_DIR="spring-wrapper/src/main/resources/static"
          rm -rf "$STATIC_DIR"
          mkdir -p "$STATIC_DIR"
          cp -r dist/* "$STATIC_DIR/"

      - name: Build frontend WAR (spring-wrapper)
        working-directory: belema_backend
        run: |
          chmod +x mvnw
          ./mvnw -f "${{ github.workspace }}/spring-wrapper/pom.xml" -DskipTests package

      - name: Build backend jar
        working-directory: belema_backend
        run: |
          chmod +x mvnw
          ./mvnw -DskipTests package

      - name: Prepare SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BELEMA_SSH_KEY }}

      - name: Backup & SCP artifacts to Belema
        env:
          BELEMA_HOST: ${{ secrets.BELEMA_SSH_HOST }}
          BELEMA_USER: ${{ secrets.BELEMA_SSH_USER }}
        run: |
          set -euo pipefail
          DATE_TAG="$(date +%Y%m%d_%H%M%S)"

          BACKEND_JAR="belema_backend/target/sparkpayapi.jar"
          FRONTEND_WAR="spring-wrapper/target/spring-wrapper-0.0.1-SNAPSHOT.war"

          ssh -o StrictHostKeyChecking=no "$BELEMA_USER@$BELEMA_HOST" "set -e
            cp -f /home/${BELEMA_USER}/supersoft/belemaApi/releases/sparkpayapi.jar \
                  /home/${BELEMA_USER}/supersoft/belemaApi/releases/sparkpayapi.jar.bak.${DATE_TAG} || true
            cp -f /home/${BELEMA_USER}/supersoft/belema_frontend/releases/belema_frontend.war \
                  /home/${BELEMA_USER}/supersoft/belema_frontend/releases/belema_frontend.war.bak.${DATE_TAG} || true"

          scp -o StrictHostKeyChecking=no "$BACKEND_JAR" "$BELEMA_USER@$BELEMA_HOST:/home/${BELEMA_USER}/supersoft/belemaApi/releases/sparkpayapi.jar"
          scp -o StrictHostKeyChecking=no "$FRONTEND_WAR" "$BELEMA_USER@$BELEMA_HOST:/home/${BELEMA_USER}/supersoft/belema_frontend/releases/belema_frontend.war"

      - name: Restart Belema services
        env:
          BELEMA_HOST: ${{ secrets.BELEMA_SSH_HOST }}
          BELEMA_USER: ${{ secrets.BELEMA_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "$BELEMA_USER@$BELEMA_HOST" "set -e
            kill_port() {
              port=\"\$1\"
              for p in \$(ss -lntp 2>/dev/null | awk -v p=\":\$port\" '\$0 ~ p {print}' | grep -o 'pid=[0-9]*' | cut -d= -f2 | sort -u || true); do
                echo \"killing pid \$p on port \$port\"
                kill -9 \"\$p\" 2>/dev/null || true
              done
            }

            API_PID=\$(cat /home/${BELEMA_USER}/supersoft/belemaApi/run/belemaApi.pid 2>/dev/null || true)
            FE_PID=\$(cat /home/${BELEMA_USER}/supersoft/belema_frontend/run/belema_frontend.pid 2>/dev/null || true)
            if [ -n \"\$API_PID\" ]; then kill \$API_PID 2>/dev/null || true; sleep 2; kill -9 \$API_PID 2>/dev/null || true; fi
            if [ -n \"\$FE_PID\" ]; then kill \$FE_PID 2>/dev/null || true; sleep 2; kill -9 \$FE_PID 2>/dev/null || true; fi
            # Stale Java often keeps the port after a bad pid-file kill; clear both listeners.
            kill_port 8077
            kill_port 18080
            sleep 2

            /home/${BELEMA_USER}/supersoft/belemaApi/run/start-belemaApi.sh
            /home/${BELEMA_USER}/supersoft/belema_frontend/run/start-belema_frontend.sh

            echo 'Waiting for local health...'
            ok_api=0
            ok_fe=0
            for i in \$(seq 1 24); do
              api_code=\$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8077/sparkpayapi/ || true)
              fe_code=\$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:18080/ || true)
              echo \"attempt \$i api=\$api_code fe=\$fe_code\"
              case \"\$api_code\" in 200|401|403|404) ok_api=1 ;; esac
              case \"\$fe_code\" in 200|301|302|304) ok_fe=1 ;; esac
              if [ \"\$ok_api\" = 1 ] && [ \"\$ok_fe\" = 1 ]; then
                ss -lntp | grep -E '(:8077|:18080)' || true
                echo 'Belema local health OK'
                exit 0
              fi
              sleep 5
            done
            echo 'Belema health check FAILED'
            ss -lntp | grep -E '(:8077|:18080)' || true
            tail -n 80 /home/${BELEMA_USER}/supersoft/belemaApi/run/*.log 2>/dev/null || true
            tail -n 80 /home/${BELEMA_USER}/supersoft/belema_frontend/run/*.log 2>/dev/null || true
            exit 1"

